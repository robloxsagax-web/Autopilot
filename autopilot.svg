<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Autopilot logo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.6" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <g opacity="0.5">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="2 12"/>
  </g>

  <path d="M 296 152 A 150 150 0 0 1 381 236" fill="none" stroke="url(#skyGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 250 110 A 150 150 0 0 0 128 180" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="381" cy="236" r="11" fill="#FFFFFF"/>
  <circle cx="381" cy="236" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <circle cx="256" cy="286" r="104" fill="url(#sphereGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="286" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <g transform="translate(256 256) scale(15) rotate(338) translate(-12.5 -12.5)" filter="url(#shadow)">
    <path d="M2.01 21L23 12L2.01 3L2.01 10L15 12L2.01 14Z" fill="url(#planeGrad)"/>
    <path d="M2.01 14L15 12L2.01 21Z" fill="#C7D2FE" fill-opacity="0.55"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 182 132 A 90 90 0 0 1 216 104" stroke-opacity="0.28" stroke-width="8"/>
    <path d="M 160 156 A  40 40 0 0 1 192 132" stroke-opacity="0.16" stroke-width="6"/>
    <path d="M 206 120 A  40 40 0  0  0 214 116" stroke-opacity="0.16" stroke-width="5"/>
  </g>
</svg>
